    <path d="M-40 795C220 670 370 670 560 770C720 855 885 860 1050 750" stroke="url(#goldFlow)" stroke-width="45" stroke-linecap="round" opacity="0.86"/>
    <path d="M1160 850C1300 750 1350 650 1350 530C1350 410 1420 345 1530 340" stroke="#D22A82" stroke-width="31" stroke-linecap="round" opacity="0.8"/>
