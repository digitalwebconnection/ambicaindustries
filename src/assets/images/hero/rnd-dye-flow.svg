<svg width="1800" height="900" viewBox="0 0 1800 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23040C"/>
      <stop offset="0.48" stop-color="#8D0B2D"/>
      <stop offset="1" stop-color="#071C38"/>
    </linearGradient>
    <linearGradient id="redFlow" x1="280" y1="180" x2="1380" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7182"/>
      <stop offset="0.3" stop-color="#E31837"/>
      <stop offset="0.72" stop-color="#A00028"/>
      <stop offset="1" stop-color="#4A071C"/>
    </linearGradient>
    <linearGradient id="blueFlow" x1="1320" y1="60" x2="1650" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55D9E7"/>
      <stop offset="1" stop-color="#0876A8"/>
    </linearGradient>
    <linearGradient id="goldFlow" x1="150" y1="780" x2="820" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC95C"/>
      <stop offset="1" stop-color="#E47C25"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="softNoise">
        <feFuncA type="table" tableValues="0 0.13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="screen"/>
    </filter>
  </defs>

